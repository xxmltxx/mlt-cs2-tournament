<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Команда | MLT CS2 TOURNAMENT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/logo.jpg">
</head>
<body>
    <div class="snow-layer"></div>
    
    <header>
    <nav>
        <a href="index.html" class="logo-container">
            <div class="header-logo">
                <img src="img/logo.jpg" alt="MLT Logo">
            </div>
            <span class="logo">MLT | CS2</span>
        </a>
        
        <!-- Гамбургер СНАРУЖИ nav-links -->
        <button class="menu-toggle" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <!-- Меню ссылок -->
        <div class="nav-links">
            <a href="teams.html"class="active">Команды</a>
            <a href="tournaments.html">Турниры</a>
            <a href="matches.html">Матчи</a>
            <a href="mlt-rating.html">MLT рейтинг</a>
            <a href="rules.html">Правила</a>
        </div>
    </nav>
</header>

    <section class="team-details-section">
        <div class="container">
            <div class="team-details-header">
                <img id="teamLogo" class="team-details-logo" src="" alt="logo">
                <div class="team-details-info">
                    <h1 id="teamName"></h1>
                    <div id="teamStats" class="team-details-stats"></div>
                </div>
            </div>

            <div class="team-details-content">
    <div class="team-roster">
        <h2>Состав</h2>
        <div id="teamRoster" class="roster-list"></div>
    </div>

    <div class="team-matches">
        <h2>Матчи</h2>
        <div id="teamMatches" class="matches-list"></div>
    </div>

    <div class="team-stats-detailed">
        <h2>Статистика</h2>
        <div id="teamStatsDetailed" class="stats-grid"></div>
    </div>
</div>

    </section>

    

    <script src="team.js"></script>
     <div class="snow-layer"></div>
      <script>
    const menuToggle = document.getElementById('menuToggle');
const navLinks = document.querySelector('.nav-links');

menuToggle.addEventListener('click', () => {
    menuToggle.classList.toggle('active');
    navLinks.classList.toggle('active');
});

// Закрываем меню при клике на ссылку
document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', () => {
        menuToggle.classList.remove('active');
        navLinks.classList.remove('active');
    });
});

// Закрываем меню при клике вне меню
document.addEventListener('click', (e) => {
    if (!e.target.closest('nav')) {
        menuToggle.classList.remove('active');
        navLinks.classList.remove('active');
    }
});

// Закрываем меню при изменении размера окна
window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
        menuToggle.classList.remove('active');
        navLinks.classList.remove('active');
    }
});

</script>
</body>
</html>
