<!DOCTYPE html>
<html lang="ru">
<head>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">.

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История матчей | MLT CS2 TOURNAMENT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="img/logo.jpg">
</head>
<body>
    <header>
    <nav>
        <a href="index.html" class="logo-container">
            <div class="header-logo">
                <img src="img/logo.jpg" alt="MLT Logo">
            </div>
            <span class="logo">MLT | CS2</span>
        </a>
        
        <!-- Гамбургер СНАРУЖИ nav-links -->
        <button class="menu-toggle" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <!-- Меню ссылок -->
        <div class="nav-links">
            <a href="teams.html">Команды</a>
            <a href="tournaments.html">Турниры</a>
            <a href="matches.html">Матчи</a>
            <a href="mlt-rating.html">MLT рейтинг</a>
             <a href="players.html" class="active">MLT Игроки</a>
            <a href="rules.html">Правила</a>
        </div>
    </nav>
</header>

            <!-- Фильтры -->
            <div class="players-filters">
                <select id="teamFilter" class="filter-select">
                    <option value="all">Все команды</option>
                </select>
                <select id="sortFilter" class="filter-select">
                    <option value="rating">По рейтингу</option>
                    <option value="name">По имени</option>
                    <option value="team">По команде</option>
                </select>
            </div>

            <!-- Таблица игроков -->
            <div class="players-table-wrapper">
                <table class="players-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Игрок</th>
                            <th>Команда</th>
                            <th>Матчи</th>
                            <th>K-D Diff</th>
                            <th>K/D</th>
                            <th>Рейтинг</th>
                        </tr>
                    </thead>
                    <tbody id="playersTableBody">
                        <!-- Генерируется JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="players.js"></script>
    <script>
    const menuToggle = document.getElementById('menuToggle');
const navLinks = document.querySelector('.nav-links');

menuToggle.addEventListener('click', () => {
    menuToggle.classList.toggle('active');
    navLinks.classList.toggle('active');
});

// Закрываем меню при клике на ссылку
document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', () => {
        menuToggle.classList.remove('active');
        navLinks.classList.remove('active');
    });
});

// Закрываем меню при клике вне меню
document.addEventListener('click', (e) => {
    if (!e.target.closest('nav')) {
        menuToggle.classList.remove('active');
        navLinks.classList.remove('active');
    }
});

// Закрываем меню при изменении размера окна
window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
        menuToggle.classList.remove('active');
        navLinks.classList.remove('active');
    }
});

</script>
</body>
</html>
