<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игрок | MLT CS2 TOURNAMENT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="img/logo.jpg">
</head>
<body>
    <div class="snow-layer"></div>
    
    <header>
        <nav>
            <a href="index.html" class="logo-container">
                <div class="header-logo">
                    <img src="img/logo.jpg" alt="MLT Logo">
                </div>
                <span class="logo">MLT | CS2</span>
            </a>
            
            <button class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <div class="nav-links">
                <a href="teams.html">Команды</a>
                <a href="tournaments.html">Турниры</a>
                <a href="matches.html">Матчи</a>
                <a href="mlt-rating.html">MLT рейтинг</a>
                <a href="players.html" class="active">MLT Игроки</a>
                <a href="rules.html">Правила</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="player-profile-section">
            <div class="container">
                
                <!-- Верхний блок: фото + инфа + статы -->
                <div class="player-profile-header">
                    <div class="player-profile-left">
                        <div class="player-avatar-box">
                            <img id="playerAvatar" src="img/default-avatar.png" alt="avatar">
                        </div>
                        <div class="player-basic-info">
                            <div class="player-name-flag">
                                <img id="playerFlag" src="" alt="flag" class="player-flag">
                                <span id="playerNickname" class="player-nickname">Starix</span>
                            </div>
                            <p id="playerRealName" class="player-real-name">Dmitry Ivanov, 23 years</p>
                            <div class="player-badge" id="playerBadge">
                                <!-- TOP PLAYER badge -->
                            </div>
                        </div>
                    </div>

                    <div class="player-stats-bar" id="playerStatsBar">
                        <!-- Rating 2.0, DPR, KAST, Impact, K/D -->
                    </div>
                </div>

                <!-- Контент: 4 блока -->
                <div class="player-content-grid">
                    <!-- Recent Results -->
                    <div class="player-card">
                        <h2>Recent Results</h2>
                        <div id="playerRecentResults" class="player-recent-list"></div>
                    </div>

                    <!-- Top Maps -->
                    <div class="player-card">
                        <h2>Top Maps in CS2</h2>
                        <div id="playerTopMaps" class="player-maps-list"></div>
                    </div>
                </div>

                <div class="player-content-grid">
                    <!-- Statistics -->
                    <div class="player-card">
                        <h2>Statistics</h2>
                        <div id="playerStatistics" class="player-statistics-list"></div>
                    </div>

                    <!-- Trophies -->
                    <div class="player-card">
                        <h2>Trophies</h2>
                        <div id="playerTrophies" class="player-trophies-grid"></div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="social-links">
                <a href="https://www.twitch.tv/mlt_cs2" title="Twitch" target="_blank">
                    <i class="fab fa-twitch"></i>
                </a>
                <a href="https://t.me/MLT_CS2" title="Telegram" target="_blank">
                    <i class="fab fa-telegram"></i>
                </a>
            </div>
            <p>&copy; 2025 MLT CS2 Tournament</p>
        </div>
    </footer>

    <script src="players-stats.js"></script>
    <script src="player.js"></script>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.querySelector('.nav-links');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navLinks.classList.toggle('active');
        });

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                navLinks.classList.remove('active');
            });
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('nav')) {
                menuToggle.classList.remove('active');
                navLinks.classList.remove('active');
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                menuToggle.classList.remove('active');
                navLinks.classList.remove('active');
            }
        });
    </script>
</body>
</html>
